       dossier's charcoal card so it reads correctly on both GitHub themes.
       Colors follow the Rangefinder seed. -->
  <rect width="500" height="140" rx="10" fill="#1b1815"/>
  <rect x="36" y="27" width="94" height="9" fill="#efeae3"/>
  <rect x="36" y="45" width="26" height="26" fill="#efeae3"/>
  <rect x="70" y="45" width="26" height="26" fill="#ff7038"/>
  <rect x="104" y="45" width="26" height="26" fill="#efeae3"/>
  <rect x="36" y="79" width="26" height="26" fill="#efeae3"/>
  <rect x="70" y="79" width="26" height="26" fill="#efeae3"/>
  <rect x="104" y="79" width="26" height="26" fill="#8fc3d8"/>
  <text x="158" y="70" dominant-baseline="central" fill="#efeae3"
        font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Consolas, monospace"
        font-size="42" font-weight="700" letter-spacing="2">TABULARIUM</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- TABULARIUM's mark: VITA's 3×2 pixel mosaic read as a records hall,
       with a lintel laid across the top so the six cells become columns.
       Colors follow the Rangefinder seed; ink flips with the OS theme. -->
  <style>
    .ink { fill: #191713; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #efeae3; }
    }
  </style>
  <rect x="2.5" y="3" width="27" height="3.75" class="ink" />
  <rect x="2.5" y="9.5" width="7.5" height="7.5" class="ink" />
  <rect x="12.25" y="9.5" width="7.5" height="7.5" fill="#ff6b2e" />
  <rect x="22" y="9.5" width="7.5" height="7.5" class="ink" />
  <rect x="2.5" y="19" width="7.5" height="7.5" class="ink" />
  <rect x="12.25" y="19" width="7.5" height="7.5" class="ink" />
  <rect x="22" y="19" width="7.5" height="7.5" fill="#7fb5c9" />
</svg>
